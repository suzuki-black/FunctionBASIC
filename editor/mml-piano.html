<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FunctionBASIC 音楽ツール（ピアノロール）</title>
<style>
  :root { --bg:#1e1f26; --panel:#282a36; --grid:#33353f; --gridbar:#4a4d5e; --text:#e6e6e6; --sub:#9aa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:8px 12px; background:var(--panel); display:flex; gap:12px; flex-wrap:wrap; align-items:center; border-bottom:1px solid #000; }
  header .grp { display:flex; gap:6px; align-items:center; }
  header label { color:var(--sub); }
  button, select, input { background:#3b3d4a; color:var(--text); border:1px solid #4a4d5e; border-radius:4px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; }
  button:hover { background:#474a5a; }
  button.on { outline:2px solid #fff; }
  .chA { background:#ff6b6b33; border-color:#ff6b6b; } .chB { background:#6bd3ff33; border-color:#6bd3ff; } .chC { background:#b5ff6b33; border-color:#b5ff6b; }
  #wrap { display:flex; gap:12px; padding:12px; align-items:flex-start; }
  #rollBox { overflow:auto; max-height:78vh; border:1px solid #000; background:#16171d; }
  canvas { display:block; cursor:crosshair; }
  #side { width:340px; display:flex; flex-direction:column; gap:8px; }
  textarea { width:100%; height:180px; background:#16171d; color:var(--text); border:1px solid #4a4d5e; border-radius:4px; font:12px/1.4 ui-monospace,Menlo,monospace; padding:6px; white-space:pre; }
  #status { color:var(--sub); min-height:1.4em; }
  h3 { margin:6px 0 2px; font-size:12px; color:var(--sub); font-weight:600; }
  .hint { color:var(--sub); font-size:12px; }
  #helpbox { margin-top:6px; border:1px solid var(--grid); border-radius:4px; }
  #helpbox > summary { cursor:pointer; padding:6px 8px; color:var(--text); background:var(--panel); user-select:none; border-radius:4px; }
  .help { padding:4px 10px 8px; font-size:12px; color:var(--sub); }
  .help b { color:var(--text); }
  .help ul { margin:2px 0 8px; padding-left:18px; }
  .help li { margin:2px 0; }
  .help kbd { background:#3b3d4a; border:1px solid #4a4d5e; border-radius:3px; padding:0 4px; color:var(--text); font-size:11px; }
</style>
</head>
<body>
<header>
  <div class="grp"><strong data-i18n="app.title">♪ 音楽ツール</strong></div>
  <div class="grp"><label>Tempo</label><input id="tempo" type="number" min="32" max="255" value="120" style="width:60px"></div>
  <div class="grp"><label data-i18n="lbl.timesig">拍子</label><input id="tsn" type="number" min="1" max="16" value="4" style="width:44px">/<select id="tsd"><option>2</option><option selected>4</option><option>8</option></select></div>
  <div class="grp"><label data-i18n="lbl.bars">小節数</label><input id="bars" type="number" min="1" max="64" value="4" style="width:50px"></div>
  <div class="grp"><label data-i18n="lbl.deflen" data-i18n-title="lbl.deflen.t" title="単クリックで置く時の既定の長さ。ドラッグで描けば任意長。">既定長</label>
    <select id="len">
      <option value="1" data-i18n="opt.whole">全</option><option value="2" data-i18n="opt.half">2分</option><option value="4" selected data-i18n="opt.q">4分</option>
      <option value="8" data-i18n="opt.e">8分</option><option value="16" data-i18n="opt.s">16分</option><option value="4." data-i18n="opt.dq">付点4分</option><option value="8." data-i18n="opt.de">付点8分</option>
    </select></div>
  <div class="grp"><label>ch</label>
    <button id="chA" class="chA on">A</button><button id="chB" class="chB">B</button><button id="chC" class="chC">C</button>
  </div>
  <div class="grp"><button id="play" data-i18n="btn.play">▶ 再生</button><button id="stop" data-i18n="btn.stop">■ 停止</button><button id="clear" data-i18n="btn.clear">クリア</button></div>
</header>

<div id="wrap">
  <div id="rollBox"><canvas id="roll" width="900" height="600"></canvas></div>
  <div id="side">
    <div id="status"></div>
    <div class="grp" style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="saveFile" data-i18n="btn.save" data-i18n-title="btn.save.t" title="曲(MML方言)をファイルに保存">💾 保存(.mml)</button>
      <button id="openFile" data-i18n="btn.open" data-i18n-title="btn.open.t" title="保存した曲(.mml)を開く">📂 開く(.mml)</button>
    </div>
    <div class="grp" style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="toMml" data-i18n="btn.toMml">→ MML 書出</button>
      <button id="fromMml" data-i18n="btn.fromMml">← MML 読込</button>
      <button id="toPlay" data-i18n="btn.toPlay">→ PLAY文(.msxb)</button>
      <button id="toFeeder" data-i18n="btn.toFeeder">→ BGM(feeder)</button>
      <button id="toSfx" data-i18n="btn.toSfx" data-i18n-title="btn.toSfx.t" title="PSGを直接スイープする急降下SFX。グライド音符があればその音程を使用。">→ SFX(急降下)</button>
      <button id="copy" data-i18n="btn.copy">コピー</button>
    </div>
    <h3 data-i18n="h3.text">テキスト（MML方言 / 生成PLAY文）</h3>
    <textarea id="io" spellcheck="false"></textarea>
    <p class="hint" data-i18n-html="hint.html">MML方言を貼って「MML読込」で音符化。「PLAY文」は FunctionBASIC の整形（1小節1行・O/L明示・3声等長）を通した生成物。CLI: <code>music.mjs import/export</code> と同じコア。</p>
    <details id="helpbox" open>
      <summary data-i18n="help.summary">操作方法（クリックで開閉）</summary>
      <div class="help" data-i18n-html="help.html"></div>
    </details>
  </div>
</div>

<div id="closeAsk" style="display:none; position:fixed; inset:0; background:#0009; align-items:center; justify-content:center; z-index:100;">
  <div style="background:var(--panel); border:1px solid #000; border-radius:8px; padding:18px 20px; max-width:380px; box-shadow:0 8px 30px #000a;">
    <p id="closeAskMsg" data-i18n="close.msg" style="margin:0 0 14px; color:var(--text); font-size:14px;">変更があります。保存しますか？</p>
    <div style="display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">
      <button id="closeCancel" data-i18n="close.cancel">キャンセル</button>
      <button id="closeDiscard" data-i18n="close.discard">保存せず閉じる</button>
      <button id="closeSave" data-i18n="close.save" style="outline:2px solid #fff;">保存して閉じる</button>
    </div>
  </div>
</div>

function t(key, ...args) {
  const v = (T[LANG] && T[LANG][key]) ?? T.ja[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
}
// 「〜（警告 N）」/「… (N warnings)」の言語別整形。
function warnMsg(baseKey, n) {
  return LANG === "en" ? (t(baseKey) + " (" + n + " warnings)") : (t(baseKey) + "（" + t("w.warn") + n + "）");
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("doc.title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
}

// ---- モデル ----
const CH = [
  { id: "A", name: "melody", color: "#ff6b6b", notes: [], ctrls: [] },
  { id: "B", name: "harmony", color: "#6bd3ff", notes: [], ctrls: [] },
  { id: "C", name: "bass", color: "#b5ff6b", notes: [], ctrls: [] },
];
let active = 0;
const LOW = 24, HIGH = 83;            // 表示音域 O2C..O6B（絶対半音）
const ROWH = 10, GUTTER = 42;         // 1半音の高さ / 左の鍵盤ラベル幅
const PXT = 0.5;                      // px per tick
const SNAP = PPQ / 4;                 // 16分グリッドにスナップ(=12tick)
const RULER = 16;                     // 上部ルーラー(クリック/ドラッグで再生位置スクラブ)
const NAME = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const $ = (id) => document.getElementById(id);
const roll = $("roll"), ctx = roll.getContext("2d");
const tempoEl = $("tempo"), tsnEl = $("tsn"), tsdEl = $("tsd"), barsEl = $("bars"), lenEl = $("len");

function measureTicks() { return Math.round(PPQ * 4 * (+tsnEl.value) / (+tsdEl.value)); }
function totalTicks() { return measureTicks() * Math.max(1, +barsEl.value); }
function lenTicks() {
  const v = lenEl.value; const dot = v.endsWith("."); const n = parseInt(v);
  let t = (PPQ * 4) / n; if (dot) t += t / 2; return Math.round(t);
}
function rowY(pitch) { return RULER + (HIGH - pitch) * ROWH; }
function yPitch(y) { return HIGH - Math.floor((y - RULER) / ROWH); }

// ---- 描画 ----
function resize() {
  roll.width = GUTTER + totalTicks() * PXT;
  roll.height = RULER + (HIGH - LOW + 1) * ROWH;
}
function draw() {
  const W = roll.width, H = roll.height, mt = measureTicks();
  ctx.clearRect(0, 0, W, H);
  // 行（黒鍵は暗く／C 行に境界）
  for (let p = LOW; p <= HIGH; p++) {
    const y = rowY(p), semi = ((p % 12) + 12) % 12;
    const black = [1,3,6,8,10].includes(semi);
    ctx.fillStyle = black ? "#1b1c22" : "#212330";
    ctx.fillRect(GUTTER, y, W - GUTTER, ROWH);
    if (semi === 0) { ctx.fillStyle = "#3a3d4e"; ctx.fillRect(GUTTER, y + ROWH - 1, W - GUTTER, 1); }
    if (semi === 0) { ctx.fillStyle = "#9aa"; ctx.font = "9px monospace"; ctx.fillText("O" + Math.floor(p/12) + "C", 4, y + ROWH - 1); }
  }
  // 縦線（拍/小節・全高）
  for (let t = 0; t <= totalTicks(); t += PPQ) {
    const x = GUTTER + t * PXT, bar = (t % mt) === 0;
    ctx.fillStyle = bar ? "#4a4d5e" : "#2c2e3a";
    ctx.fillRect(x, RULER, bar ? 2 : 1, H - RULER);
  }
  // ルーラー(上部・クリックで再生位置スクラブ)
  ctx.fillStyle = "#191a20"; ctx.fillRect(0, 0, W, RULER);
  ctx.fillStyle = "#3a3d4e"; ctx.fillRect(GUTTER, RULER - 1, W - GUTTER, 1);
  for (let t = 0; t <= totalTicks(); t += mt) {
    const x = GUTTER + t * PXT;
    ctx.fillStyle = "#4a4d5e"; ctx.fillRect(x, 0, 2, RULER);
    ctx.fillStyle = "#9aa"; ctx.font = "9px monospace"; ctx.fillText((t / mt) + 1 + "", x + 3, 11);
  }
  // 音符（非アクティブは薄く）
  CH.forEach((ch, ci) => {
    for (const n of ch.notes) {
      if (n.pitch < LOW || n.pitch > HIGH) continue;
      const x = GUTTER + n.start * PXT, y = rowY(n.pitch), w = Math.max(3, n.dur * PXT - 1);
      ctx.globalAlpha = ci === active ? 1 : 0.35;
      ctx.fillStyle = ch.color;
      ctx.fillRect(x, y + 1, w, ROWH - 2);
      if (n.glideTo != null && n.glideTo !== n.pitch) {
        const gy = rowY(n.glideTo) + ROWH / 2;
        ctx.strokeStyle = ch.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + ROWH / 2); ctx.lineTo(x + w, gy); ctx.stroke();
        ctx.fillRect(x + w - 3, gy - (ROWH - 2) / 2, 3, ROWH - 2);
      }
      ctx.globalAlpha = 1;
    }
  });
  // 再生ヘッド（常時表示・全高＋ルーラーに掴みハンドル）
  const px = GUTTER + playPos * PXT;
  ctx.fillStyle = playing ? "#ffcc44" : "#ff9a3c";
  ctx.fillRect(px, 0, 2, H);
  ctx.beginPath(); ctx.moveTo(px - 4, 0); ctx.lineTo(px + 6, 0); ctx.lineTo(px + 1, 9); ctx.closePath(); ctx.fill();
}

// ---- 編集（標準ピアノロール流：ドラッグで描画／右端でリサイズ／本体で移動／右クリック削除／
//        単クリックは直近の長さで配置。音長ドロップダウンは「単クリック時の既定長」）----
let lastLen = lenTicks();                 // 直近の音符長（クリック配置に使う）
lenEl.addEventListener("change", () => { lastLen = lenTicks(); });
const EDGE = 6;                           // 右端リサイズ判定幅(px)
let drag = null;                          // {mode:'draw'|'resize'|'move', i, grabTick}

const evtPos = (e) => {
  const r = roll.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return { x, y, tick: Math.max(0, (x - GUTTER) / PXT), pitch: yPitch(y) };
};
const snapR = (t) => Math.max(0, Math.round(t / SNAP) * SNAP);   // 最寄り
const snapC = (t) => Math.ceil(t / SNAP) * SNAP;                 // 切り上げ（右端用）
function hitNote(ch, x, tick, pitch) {
  for (let i = ch.notes.length - 1; i >= 0; i--) {
    const n = ch.notes[i];
    if (n.pitch !== pitch || tick < n.start || tick >= n.start + n.dur) continue;
    const endX = GUTTER + (n.start + n.dur) * PXT;
    return { i, edge: Math.abs(x - endX) <= EDGE };
  }
  return null;
}

roll.addEventListener("contextmenu", (e) => {   // 右クリック＝削除
  e.preventDefault();
  const p = evtPos(e); if (p.x < GUTTER) return;
  const h = hitNote(CH[active], p.x, p.tick, p.pitch);
  if (h) { CH[active].notes.splice(h.i, 1); draw(); status(t("st.noteDeleted")); changed(); }
});

roll.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;                    // 左のみ（右はcontextmenu）
  const p = evtPos(e);
  if (p.x < GUTTER) return;
  if (p.y < RULER) { drag = { mode: "scrub" }; playPos = snapR(p.tick); draw(); return; } // ルーラー=再生位置スクラブ
  if (p.pitch < LOW || p.pitch > HIGH) return;
  const ch = CH[active];
  const h = hitNote(ch, p.x, p.tick, p.pitch);
  if (h && e.shiftKey) drag = { mode: "glide", i: h.i };      // Shift+ドラッグ＝グライド先を指定
  else if (h && h.edge) drag = { mode: "resize", i: h.i };
  else if (h) drag = { mode: "move", i: h.i, grabTick: p.tick - ch.notes[h.i].start };
  else {
    ch.notes.push({ start: snapR(p.tick), dur: lastLen, pitch: p.pitch, vol: 8 });
    drag = { mode: "draw", i: ch.notes.length - 1 };
  }
  draw();
});

window.addEventListener("mousemove", (e) => {
  const p = evtPos(e);
  if (!drag) {                                   // カーソルフィードバック
    if (p.x >= GUTTER && p.y < RULER) roll.style.cursor = "ew-resize";     // ルーラー
    else if (p.x >= GUTTER && p.pitch >= LOW && p.pitch <= HIGH) {
      const h = hitNote(CH[active], p.x, p.tick, p.pitch);
      roll.style.cursor = h ? (h.edge ? "ew-resize" : "move") : "crosshair";
    } else roll.style.cursor = "default";
    return;
  }
  if (drag.mode === "scrub") { playPos = snapR(p.tick); draw(); return; }  // 再生位置スクラブ
  const n = CH[active].notes[drag.i]; if (!n) { drag = null; return; }
  if (drag.mode === "draw" || drag.mode === "resize") {
    n.dur = Math.max(SNAP, snapC(p.tick) - n.start);       // 右へドラッグで伸縮
  } else if (drag.mode === "glide") {
    if (p.pitch >= LOW && p.pitch <= HIGH) n.glideTo = p.pitch;   // グライド先の音程
  } else {                                                 // move
    n.start = Math.max(0, snapR(p.tick - drag.grabTick));
    if (p.pitch >= LOW && p.pitch <= HIGH) n.pitch = p.pitch;
  }
  draw();
});

window.addEventListener("mouseup", () => {
  const wasEdit = !!drag && drag.mode !== "scrub";   // scrub(再生位置移動)は編集ではない
  if (drag && (drag.mode === "draw" || drag.mode === "resize")) {
    const n = CH[active].notes[drag.i];
    if (n) lastLen = n.dur;                       // 直近長を更新（次の単クリックに反映）
  }
  if (drag && drag.mode === "glide") {
    const n = CH[active].notes[drag.i];
    if (n && n.glideTo === n.pitch) delete n.glideTo;  // 同音＝グライド解除
  }
  drag = null;
  if (wasEdit) changed();                          // 編集完了→自動退避
});

// ---- ch 切替 ----
["A","B","C"].forEach((id, i) => $("ch" + id).addEventListener("click", () => {
  active = i; ["A","B","C"].forEach((x, j) => $("ch" + x).classList.toggle("on", j === i)); draw();
}));

// ---- テキスト I/O ----
function currentSong() {
  return notesToSong(CH.map((c) => ({ id: c.id, name: c.name, notes: c.notes, ctrls: c.ctrls })),
    { tempo: +tempoEl.value, timesig: [+tsnEl.value, +tsdEl.value] });
}
$("toMml").addEventListener("click", () => { $("io").value = songToMml(currentSong()); status(t("st.mmlWritten")); });
$("toPlay").addEventListener("click", () => {
  const { code, warnings } = songToPlayBasic(currentSong(), { func: "BGM_MAIN" });
  $("io").value = code; status(warnings.length ? warnMsg("w.playGen", warnings.length) : t("st.playGen"));
});
$("toFeeder").addEventListener("click", () => {
  const { code, warnings } = songToFeederBasic(currentSong(), { func: "BGM" });
  $("io").value = code; status(warnings.length ? warnMsg("w.feederGen", warnings.length) : t("st.feederGen"));
});
$("toSfx").addEventListener("click", () => {
  // 最初のグライド音符から from→to を採る（無ければ既定 O6C→O3C の急降下）
  let from = 72, to = 36, src = t("src.default");
  for (const ch of CH) { const g = ch.notes.find((n) => n.glideTo != null && n.glideTo !== n.pitch); if (g) { from = g.pitch; to = g.glideTo; src = t("src.glide"); break; } }
  const { code, warnings } = sfxSweepBasic(from, to, { func: "SFX_DROP" });
  $("io").value = code; status(t("f.sfx", warnings.length, src));
  playSweep(from, to); // Web Audio で急降下を試聴（実機は生成した SFX_DROP() で鳴る）
});
// MML方言テキストを取り込んで音符化（テキスト欄「MML読込」とファイル「開く」で共有）。
function loadMmlText(text, srcLabel) {
  const { song, warnings } = parseMmlDoc(text);
  const grid = songToNotes(song);
  tempoEl.value = grid.tempo; tsnEl.value = grid.timesig[0]; tsdEl.value = grid.timesig[1];
  CH.forEach((c) => { c.notes = []; c.ctrls = []; });
  grid.channels.forEach((gc, i) => { if (CH[i]) { CH[i].notes = gc.notes; CH[i].ctrls = gc.ctrls; } });
  resize(); draw();
  const pre = srcLabel ? (srcLabel + " ") : "";
  status(warnings.length ? (pre + warnMsg("w.loadedWarn", warnings.length)) : (pre + t("st.loaded")));
}
$("fromMml").addEventListener("click", () => {
  try { loadMmlText($("io").value); changed(); } catch (err) { status(t("f.loadErr", err.message)); }
});

// ---- ディスク保存 / 読込（デスクトップ=Tauriダイアログ / ブラウザ=ダウンロード・input） ----
const tauriInvoke = window.__TAURI__?.core?.invoke ?? null;
// 保存を実行。成功=true / キャンセル・失敗=false（閉じる確認から成否を見て使う）。
async function doSave() {
  const mml = currentMml();
  const name = "song.mml";
  try {
    if (tauriInvoke) {
      const path = await tauriInvoke("save_text_file", { defaultName: name, filterName: "MML music", ext: "mml", content: mml });
      if (path) { setBaseline(); status(t("f.saved", path)); return true; }
      status(t("st.saveCanceled")); return false;
    }
    const blob = new Blob([mml], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
    setBaseline(); status(t("f.downloaded", name)); return true;
  } catch (err) { status(t("f.saveErr", err.message)); return false; }
}
$("saveFile").addEventListener("click", doSave);
$("openFile").addEventListener("click", async () => {
  try {
    if (tauriInvoke) {
      const res = await tauriInvoke("open_text_file", { filterName: "MML music", ext: "mml" });
      if (!res) { status(t("st.loadCanceled")); return; }
      $("io").value = res.content;
      loadMmlText(res.content, res.name);
      setBaseline(); scheduleAutosave();       // 開いた内容が基準（dirtyでない）＋退避も更新
    } else {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".mml,.txt,text/plain";
      inp.addEventListener("change", async () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        const text = await f.text();
        $("io").value = text;
        try { loadMmlText(text, f.name); setBaseline(); scheduleAutosave(); } catch (err) { status(t("f.loadErr", err.message)); }
      });
      inp.click();
    }
  } catch (err) { status(t("f.loadErr", err.message)); }
});
$("copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("io").value); status(t("st.copied")); } catch { status(t("st.copyFail")); } });
$("clear").addEventListener("click", () => { CH.forEach((c) => { c.notes = []; c.ctrls = []; }); draw(); status(t("st.cleared")); changed(); });
[tempoEl, tsnEl, tsdEl, barsEl].forEach((el) => el.addEventListener("change", () => { resize(); draw(); changed(); }));
function status(s) { $("status").textContent = s; }

// ---- 一時保存(自動退避) / 変更検知 / 閉じる確認 ----
let savedMml = "";                 // dirty判定の基準（起動時・ディスク保存/読込で更新）
let autosaveTimer = 0;
function currentMml() { return songToMml(currentSong()); }
function isDirty() { return currentMml() !== savedMml; }
function setBaseline() { savedMml = currentMml(); }
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(async () => {
    const mml = currentMml();
    try {
      if (tauriInvoke) await tauriInvoke("music_autosave_set", { content: mml });
      else localStorage.setItem("musictool.autosave", mml);
    } catch {}
  }, 400);
}
function changed() { scheduleAutosave(); }   // 編集完了点から呼ぶ（dirtyは isDirty() で都度計算）
async function loadAutosave() {
  try {
    if (tauriInvoke) return await tauriInvoke("music_autosave_get");
    return localStorage.getItem("musictool.autosave");
  } catch { return null; }
}
// 閉じる時、未保存の変更があれば確認する。
const closeAskEl = $("closeAsk");
let closeConfirmed = false;
const tauriWin = window.__TAURI__?.window?.getCurrentWindow ? window.__TAURI__.window.getCurrentWindow() : null;
function forceClose() { closeConfirmed = true; if (tauriWin) tauriWin.destroy(); else window.close(); }
$("closeCancel").addEventListener("click", () => { closeAskEl.style.display = "none"; });
$("closeDiscard").addEventListener("click", () => { closeAskEl.style.display = "none"; forceClose(); });
$("closeSave").addEventListener("click", async () => {
  const ok = await doSave();
  closeAskEl.style.display = "none";
  if (ok) forceClose();               // 保存できたら閉じる。キャンセル/失敗なら閉じない。
});
if (tauriWin) {
  tauriWin.onCloseRequested((ev) => {
    if (closeConfirmed || !isDirty()) return;   // 確認済み or 変更なし=そのまま閉じる
    ev.preventDefault();
    closeAskEl.style.display = "flex";
  });
} else {
  window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
}

// ---- 再生（Web Audio・矩形波3声）＋プレイヘッド（常時表示・カーソル位置から再生・停止で開始位置へ） ----
let actx = null, oscs = [], playing = false, playPos = 0, playStart = 0, tickTimer = 0;
$("play").addEventListener("click", () => {
  stopAll();
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume(); // 一時停止からの復帰(これが無いと2回目以降無音)
  const spt = (60 / (+tempoEl.value)) / PPQ; // 秒/tick
  const t0 = actx.currentTime + 0.05;
  const freqOf = (p) => 440 * Math.pow(2, ((p + 12) - 69) / 12);
  playStart = playPos;                        // 停止したらここへ戻す
  const total = totalTicks();
  CH.forEach((ch) => {
    for (const n of ch.notes) {
      if (n.start + n.dur <= playPos) continue;       // 再生位置より前の音は飛ばす
      const from = Math.max(n.start, playPos);
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = "square";
      const s = t0 + (from - playPos) * spt, e = t0 + (n.start + n.dur - playPos) * spt;
      osc.frequency.setValueAtTime(freqOf(n.pitch), s);
      if (n.glideTo != null && n.glideTo !== n.pitch)
        osc.frequency.exponentialRampToValueAtTime(freqOf(n.glideTo), Math.max(s + 0.02, e));
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.15, s + 0.01);
      g.gain.setValueAtTime(0.15, e - 0.02); g.gain.exponentialRampToValueAtTime(0.0001, e);
      osc.connect(g).connect(actx.destination); osc.start(s); osc.stop(e + 0.02); oscs.push(osc);
    }
  });
  playing = true;
  const startMs = performance.now() + 50;
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {                       // 実時計でプレイヘッドを曲の全長まで進める
    const tk = playStart + (performance.now() - startMs) / 1000 / spt;
    if (tk >= total) { clearInterval(tickTimer); playing = false; playPos = playStart; draw(); status(t("st.playEnd")); return; }
    playPos = Math.max(0, tk); draw();
  }, 30);
  status(t("st.playing"));
});
function stopAll() { oscs.forEach((o) => { try { o.stop(); } catch {} }); oscs = []; clearInterval(tickTimer); playing = false; }
// 急降下SFXの試聴（from→to へ矩形波を滑らかにスイープ）
function playSweep(from, to) {
  stopAll();
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  const f = (p) => 440 * Math.pow(2, ((p + 12) - 69) / 12);
  const t = actx.currentTime + 0.02, dur = 0.45;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(f(from), t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, f(to)), t + dur);
  g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(actx.destination); osc.start(t); osc.stop(t + dur + 0.02); oscs.push(osc);
}
// 停止: 1回目=その場で一時停止(線は残る) / 2回目(停止中)=先頭(0)へ戻す。
$("stop").addEventListener("click", () => {
  if (playing) { stopAll(); draw(); status(t("st.paused")); }
  else if (playPos !== 0) { playPos = 0; playStart = 0; draw(); status(t("st.toStart")); }
});

// ---- 初期化: 多言語適用 → 前回の自動退避があれば復元、無ければ初期サンプル ----
applyI18n();
(async () => {
  const initial = "@tempo 120\n@timesig 4/4\n@ch A melody\n@ch B bass\nA: O4 L8 CDEF GAB>C | O5 C<BAGFED C\nB: O2 L2 CG | FG\n";
  const saved = await loadAutosave();
  const restore = saved && saved.trim();
  $("io").value = restore ? saved : initial;
  try { loadMmlText($("io").value); }
  catch { $("io").value = initial; try { loadMmlText(initial); } catch {} }
  setBaseline();                       // 復元/初期どちらも基準(=dirtyでない)から開始
  resize(); draw();
  status(restore ? t("st.restored") : t("status.hint"));
})();
</script>
</body>
</html>
